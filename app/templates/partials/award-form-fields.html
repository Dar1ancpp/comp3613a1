<div class="mb-3"><label class="form-label" for="name-{{ award.id if award else 'new' }}">Award name</label><input class="form-control" id="name-{{ award.id if award else 'new' }}" name="name" value="{{ award.name if award else '' }}" required></div>
<div class="mb-3"><label class="form-label" for="description-{{ award.id if award else 'new' }}">Description</label><textarea class="form-control" id="description-{{ award.id if award else 'new' }}" name="description" rows="3">{{ award.description or '' if award else '' }}</textarea></div>
<div class="row g-3 mb-3">
  <div class="col-6"><label class="form-label" for="hours-{{ award.id if award else 'new' }}">Required hours</label><input class="form-control" id="hours-{{ award.id if award else 'new' }}" name="required_hours" type="number" min="0.25" step="0.25" value="{{ format_hours(award.required_hours) if award else '' }}" required></div>
  <div class="col-6"><label class="form-label" for="quantity-{{ award.id if award else 'new' }}">Quantity</label><input class="form-control" id="quantity-{{ award.id if award else 'new' }}" name="quantity_available" type="number" min="0" step="1" value="{{ award.quantity_available if award else '0' }}" required></div>
</div>
<div class="form-check"><input class="form-check-input" id="active-{{ award.id if award else 'new' }}" name="active" type="checkbox" value="true" {{ 'checked' if not award or award.active else '' }}><label class="form-check-label" for="active-{{ award.id if award else 'new' }}">Active and visible to students</label></div>
